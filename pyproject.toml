[project]
name = "agentic-soc"
version = "0.1.0"
description = "Agentic SOC for a simulated enterprise: multi-stream telemetry, ML detectors, MCP-orchestrated local-LLM triage agent and closed-loop containment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adi" }, { name = "Cristi" }, { name = "Dragos" }]
dependencies = [
    "confluent-kafka>=2.16.1",
    "duckdb>=2.0.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.0",
    "orjson>=3.13.0",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "pydantic>=2.9",
    "pytz>=2026.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.8",
    "typer>=0.12",
]

[project.scripts]
soc = "agentic_soc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_soc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: needs external services (Redpanda, TimescaleDB) started with docker compose",
    "llm: needs a local LLM served by Ollama",
    "slow: long-running end-to-end tests",
]
