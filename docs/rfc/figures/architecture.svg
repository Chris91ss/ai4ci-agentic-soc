<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="Calibri, 'Segoe UI', Arial, Helvetica, sans-serif" style="font-variant-ligatures: none" role="img" aria-labelledby="t d">
<title id="t">Agentic SOC architecture</title>
<desc id="d">A seeded simulator emits sign-in, network-flow and endpoint-process streams to a Kafka-compatible broker. Ingestion validates and stores events; online inference runs three detectors (M1-M3); a correlation and routing layer escalates incidents to a local-LLM triage agent that acts through an MCP server. Containment actions flow back through the actions topic to the simulator, closing the feedback loop.</desc>
<defs>
