<text x="58.0" y="21.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Simulator</text>
<text x="58.0" y="34.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">enterprise, seeded</text>
<text x="58.0" y="46.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">YAML config</text>
<text x="58.0" y="58.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">LANL-calibrated</text>
<text x="58.0" y="82.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">streams:</text>
<text x="58.0" y="94.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">sign-ins</text>
<text x="58.0" y="106.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">network flows</text>
<text x="58.0" y="118.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">endpoint processes</text>
<text x="58.0" y="142.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">ATT&amp;CK campaign</text>
<text x="58.0" y="154.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">+ benign look-alikes</text>
<text x="58.0" y="166.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">ground-truth labels</text>
<text x="58.0" y="189.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">applies actions</text>
<text x="176.0" y="21.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Event broker</text>
<text x="176.0" y="34.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">Kafka-compatible</text>
<text x="176.0" y="58.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">topics:</text>
<text x="176.0" y="70.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">signin</text>
<text x="176.0" y="82.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">flow</text>
<text x="176.0" y="94.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">process</text>
<text x="176.0" y="106.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">dead-letter</text>
<text x="176.0" y="189.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">actions</text>
<text x="292.0" y="29.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Ingestion</text>
<text x="292.0" y="42.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">schema validation</text>
<text x="292.0" y="54.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">dead-letter on error</text>
<text x="292.0" y="66.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">dedupe, normalise</text>
<text x="292.0" y="78.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">enrich (assets, IDs)</text>
<text x="292.0" y="149.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Storage</text>
<text x="292.0" y="162.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">TimescaleDB (hot)</text>
<text x="292.0" y="174.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">Parquet (cold)</text>
<text x="292.0" y="186.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">labels, audit log</text>
<text x="420.0" y="23.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Online inference</text>
<text x="420.0" y="36.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">event-time windows</text>
<text x="420.0" y="48.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">entity resolution</text>
<text x="420.0" y="60.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">M1 IsolationForest</text>
<text x="420.0" y="72.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">M2 LightGBM</text>
<text x="420.0" y="84.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">M3 process n-grams</text>
<text x="420.0" y="143.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Offline ETL</text>
<text x="420.0" y="156.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">DuckDB over Parquet</text>
<text x="420.0" y="168.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">training, replay</text>
<text x="420.0" y="180.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">drift checks (PSI)</text>
<text x="420.0" y="192.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">retraining</text>
<text x="545.0" y="23.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Risk router</text>
<text x="545.0" y="36.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">alerts to incidents</text>
<text x="545.0" y="48.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">risk per entity</text>
<text x="545.0" y="60.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">low: log only</text>
<text x="545.0" y="72.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">high: agent queue</text>
<text x="545.0" y="84.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">timeout: playbook</text>
<text x="545.0" y="143.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Backend + UI</text>
<text x="545.0" y="156.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">FastAPI</text>
<text x="545.0" y="168.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">React / Next.js</text>
