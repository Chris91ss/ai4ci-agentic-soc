<text x="545.0" y="192.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">approve / reject</text>
<text x="666.0" y="29.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">Triage agent</text>
<text x="666.0" y="42.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">decision maker</text>
<text x="666.0" y="54.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">local LLM, ReAct</text>
<text x="666.0" y="66.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">verdict + action</text>
<text x="666.0" y="78.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">JSON-validated</text>
<text x="666.0" y="143.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#000000">MCP server</text>
<text x="666.0" y="156.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">tools: timeline,</text>
<text x="666.0" y="168.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">score_* (M1-M3),</text>
<text x="666.0" y="180.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">context, actions</text>
<text x="666.0" y="192.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000000">policy gate</text>
