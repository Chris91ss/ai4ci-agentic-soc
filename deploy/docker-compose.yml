# Agentic SOC infrastructure. Start with `make up` (or `docker compose -f deploy/docker-compose.yml up -d`).
name: agentic-soc

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.7
    container_name: soc-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"   # Kafka API (host clients: kafka://localhost:19092)
      - "18081:18081"   # schema registry
      - "18082:18082"   # HTTP proxy
      - "19644:9644"    # admin API
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  timescaledb:
    image: timescale/timescaledb:2.32.0-pg17
    container_name: soc-timescaledb
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${SOC_DB_PASSWORD:-soc}   # local development default
      POSTGRES_DB: soc
    ports:
      - "15432:5432"    # host clients: postgresql+psycopg://soc:soc@localhost:15432/soc
    volumes:
      - timescaledb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: redpandadata/console:v3.14.0
    container_name: soc-redpanda-console
    profiles: ["console"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8088:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  redpanda:
  timescaledb:
