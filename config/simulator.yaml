# Agentic SOC simulator configuration.
# Every value has a default in agentic_soc/simulator/config.py; scenario overlays in
# config/scenarios/ only contain what they change. Runs are deterministic under `seed`.

seed: 7
start: "2026-03-02T00:00:00Z"   # a Monday, UTC
duration_h: 48
tick_s: 60                      # simulation step in seconds
calibration: default            # config/calibration/<name>.yaml (see `soc calibrate`)

org:
  name: Example Corp
  domain: corp.example
  netbios: CORP
  timezone: Europe/Bucharest
  home_country: RO
  users: 200                    # one workstation per user + 50 servers = 250 hosts
  weak_password_share: 0.04     # accounts that fall to a password spray
  offices:
    - {name: HQ, city: Cluj-Napoca, country: RO, lat: 46.77, lon: 23.60, egress_netblock: 193.226.51.0/24, share: 0.65}
    - {name: Bucharest, city: Bucharest, country: RO, lat: 44.43, lon: 26.10, egress_netblock: 82.77.140.0/24, share: 0.35}
  servers:
    - {role: dc, count: 3, criticality: 5}
    - {role: file, count: 4, criticality: 4}
    - {role: db, count: 5, criticality: 5}
    - {role: app, count: 12, os: linux, criticality: 3}
    - {role: erp, count: 2, criticality: 5}
    - {role: mail, count: 2, criticality: 4}
    - {role: backup, count: 2, criticality: 4}
    - {role: jump, count: 2, criticality: 4}
    - {role: edr, count: 1, criticality: 4}
    - {role: wsus, count: 1, criticality: 2}
    - {role: print, count: 2, criticality: 1}
    - {role: monitoring, count: 2, os: linux, criticality: 3}
    - {role: build, count: 4, os: linux, criticality: 3}
    - {role: web, count: 5, zone: dmz, os: linux, criticality: 3}
    - {role: proxy, count: 2, zone: dmz, os: linux, criticality: 3}
    - {role: vpn, count: 1, zone: dmz, os: linux, criticality: 5}
  # Roles (share of employees, remote/travel habits, SSO apps and desktop tools) use the
  # defaults from config.py; override a role here to change it, e.g.
  # roles:
  #   engineering: {share: 0.3, department: Engineering, remote_prob: 0.5, apps: [...], tools: [...]}

# Benign activity rates (per active user/host hour unless noted).
activity:
  weekday_attendance: 0.94
  signin: {sso_per_hour: 1.4, network_logons_per_hour: 1.0, mobile_checks_per_evening: 1.5, admin_rdp_per_day: 3.0, mfa_prob: 0.35, monitor_logons_per_hour: 20}
  flow: {web_per_hour: 40, internal_per_hour: 18, app_db_per_hour: 25, dmz_inbound_per_hour: 120, heartbeat_s: 900, monitoring_s: 600, edr_cloud_s: 60}
  process: {server_per_hour: 12}

# Benign behaviour that resembles attack steps (hard negatives for the detectors).
lookalikes:
  typos: true                    # failed password followed by a success
  travel: true                   # multi-day trips abroad, VPN from foreign ISPs
  remote_vpn: true
  admin_rdp: true                # admins RDP to servers through jump hosts
  admin_maintenance_weekday: 1   # patch night (Tuesday): one admin RDPs into many servers
  nightly_backup: true           # large internal pulls, then offsite upload to cloud storage
  backup_start_h: 1.0
  backup_internal_gb: [5.0, 15.0]
  backup_offsite_gb: [2.0, 6.0]
  dev_hosting: true              # developers push builds to VPS providers over SSH
  edr_cloud_sync: true           # EDR server beacons to the vendor cloud every minute

# Transport of each stream to the broker: delays, stragglers, duplicates, producer clock
# skew, malformed payloads (dead-letter) and legacy schema-0.9 producers.
delivery:
  signin:
    {median_delay_s: 2.0, sigma: 0.6, late_prob: 0.01, late_delay_s: [60, 600], duplicate_prob: 0.003,
     clock_skew_s: 0.3, malformed_prob: 0.0005, legacy_prob: 0.35}
  flow:
    {median_delay_s: 15.0, sigma: 0.5, late_prob: 0.02, late_delay_s: [120, 900], duplicate_prob: 0.01,
     clock_skew_s: 1.0, malformed_prob: 0.0003, legacy_sources: [sensor-dc-01]}
  process:
    {median_delay_s: 4.0, sigma: 0.9, late_prob: 0.03, late_delay_s: [300, 3600], duplicate_prob: 0.005,
     clock_skew_s: 0.5, drifted_clock_prob: 0.03, malformed_prob: 0.0005}

# The injected ATT&CK campaign: password spray -> VPN with a valid account -> RDP foothold ->
# discovery -> PowerShell implant + C2 beacon -> LSASS dump -> PsExec/RDP lateral movement ->
# collection with 7-Zip -> exfiltration over C2. It reacts to containment (pivots or stalls).
campaign:
  enabled: true
  campaign_id: CAMP-1
  start_offset_h: 19.0           # Monday ~21:00 local, +/- start_jitter_h (seeded)
  start_jitter_h: 3.0
  dwell_scale: 1.0               # >1 slows the attacker down between stages
  spray_targets: 80
  spray_passwords: 2
  spray_interval_s: [15, 45]
  attacker_blocks: [45.32.0.0/16, 193.106.191.0/24, 185.220.100.0/22, 51.75.0.0/16]
  c2_blocks: [95.216.0.0/16, 159.89.0.0/16, 103.75.0.0/16]   # shared with benign dev/mirror hosts
  c2_ports: [443]
  beacon_period_s: [45, 180]
  beacon_jitter: [0.1, 0.35]
  scan_targets: [25, 60]
  exfil_gb: [1.5, 4.0]
  pivot: true                    # rotate spray / C2 infrastructure when blocked
  prompt_injection: true         # instructions for LLM analysts hidden in user agents and command lines
